{% extends "edtech/base.html" %}{% block title %}Join Tuition.com{% endblock %}{% block content %}
<section class="auth-page"><div class="auth-card wide"><span class="kicker">{% if role == 'teacher' %}Teach with us{% else %}Start learning{% endif %}</span><h1>Create your {{ role }} account</h1><form method="post">{% csrf_token %}<div class="form-grid"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name"></label></div><label>Username<input name="username" required></label><label>Email<input type="email" name="email" required></label><div class="form-grid"><label>Password<input name="password" type="password" required><span class="strength" id="strength"></span></label><label>Confirm password<input name="confirm_password" type="password" required></label></div><button class="btn primary full" type="submit">Create Account</button></form><p>Already registered? <a href="{% url 'login' %}">Login</a></p></div></section>
{% endblock %}

{% extends "edtech/base.html" %}{% block title %}Login — Tuition.com{% endblock %}{% block content %}
<section class="auth-page"><div class="auth-card"><span class="kicker">Welcome back</span><h1>Sign in to your account</h1><form method="post">{% csrf_token %}<label>Username<input name="username" required></label><label>Password<div class="password-field"><input name="password" type="password" required><button type="button" onclick="togglePassword(this)" aria-label="Show password"><i data-lucide="eye"></i></button></div></label><button class="btn primary full" type="submit">Login</button></form><p>New here? <a href="{% url 'register' role='student' %}">Create a student account</a></p></div></section>
{% endblock %}

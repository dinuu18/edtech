{% extends "edtech/base.html" %}{% block content %}<section class="auth-page"><div class="auth-card wide"><span class="kicker">Personal details</span><h1>Edit profile</h1><form method="post">{% csrf_token %}<div class="form-grid"><label>First name<input name="first_name" value="{{ user.first_name }}"></label><label>Last name<input name="last_name" value="{{ user.last_name }}"></label></div><label>Email<input type="email" name="email" value="{{ user.email }}"></label><label>Phone<input name="phone" value="{{ profile.phone }}"></label>{% if user.teacher_profile %}<label>Professional headline<input name="headline" value="{{ user.teacher_profile.headline }}"></label><label>Biography<textarea name="biography" rows="5">{{ user.teacher_profile.biography }}</textarea></label><label>Qualifications<input name="qualifications" value="{{ user.teacher_profile.qualifications }}"></label><div class="form-grid"><label>Experience (years)<input name="experience_years" type="number" value="{{ user.teacher_profile.experience_years }}"></label><label>Hourly fee (₹)<input name="hourly_fee" type="number" value="{{ user.teacher_profile.hourly_fee }}"></label></div>{% endif %}<button class="btn primary full">Save Changes</button></form></div></section>{% endblock %}
